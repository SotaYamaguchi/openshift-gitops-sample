apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: openshift-gitops
spec:
  applicationSet:
    enabled: true
  server:
    route:
      enabled: true
      tls:
        termination: reencrypt
  ha:
    enabled: false
  # ref: https://access.redhat.com/solutions/7014191
  rbac:
    defaultPolicy: ''
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
    scopes: '[groups]'
