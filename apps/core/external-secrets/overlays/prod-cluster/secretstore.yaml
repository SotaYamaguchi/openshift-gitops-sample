apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1 # TODO: Set actual value
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa # TODO: Set actual value
            namespace: openshift-operators # TODO: Set actual value
      role: arn:aws:iam::123456789012:role/workload-external-secrets-role # TODO: Set actual value
