apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: openshift-gitops
spec:
  server:
    autoscale:
      enabled: false
    grpc:
      ingress:
        enabled: false
    ingress:
      enabled: false
    route:
      enabled: true
      tls:
        termination: reencrypt
    service:
      type: ""
  controller:
    appSync: 30s
    processors: {}
    sharding: {}
  ha:
    enabled: false
  notifications:
    enabled: false
  monitoring:
    enabled: false
  grafana:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  # RBAC: 未認証ユーザーの権限をなしに設定 (デフォルトは role:readonly で情報漏洩リスクあり)
  # ref: https://access.redhat.com/solutions/7014191
  rbac:
    defaultPolicy: ''
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
    scopes: '[groups]'
  # Custom health checks for OLM resources
  # ref: https://access.redhat.com/solutions/7015069
  resourceHealthChecks:
    - group: operators.coreos.com
      kind: Subscription
      check: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.conditions ~= nil then
            numDegraded = 0
            msg = ""
            for i, condition in pairs(obj.status.conditions) do
              msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. "\n"
              if condition.type == "CatalogSourcesUnhealthy" and condition.status == "True" then
                numDegraded = numDegraded + 1
              elseif condition.type == "InstallPlanFailed" and condition.status == "True" then
                numDegraded = numDegraded + 1
              elseif condition.type == "ResolutionFailed" and condition.status == "True" then
                numDegraded = numDegraded + 1
              end
            end
            if numDegraded > 0 then
              hs.status = "Degraded"
              hs.message = msg
              return hs
            end
          end
          if obj.status.installedCSV ~= nil and obj.status.installedCSV ~= "" then
            hs.status = "Healthy"
            hs.message = obj.status.installedCSV
            return hs
          end
          if obj.status.state ~= nil and obj.status.state == "AtLatestKnown" then
            hs.status = "Healthy"
            hs.message = "At latest known"
            return hs
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for Operator installation"
        return hs
    - group: operators.coreos.com
      kind: InstallPlan
      check: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.phase ~= nil then
            if obj.status.phase == "Complete" then
              hs.status = "Healthy"
              hs.message = "InstallPlan complete"
              return hs
            elseif obj.status.phase == "Failed" then
              hs.status = "Degraded"
              hs.message = "InstallPlan failed"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for InstallPlan"
        return hs
  # Tekton の一時的な実行リソースを ArgoCD の管理対象から除外
  # ref: https://access.redhat.com/solutions/6956914
  resourceExclusions: |
    - apiGroups:
        - tekton.dev
      clusters:
        - '*'
      kinds:
        - TaskRun
        - PipelineRun
  applicationSet:
    webhookServer:
      ingress:
        enabled: false
      route:
        enabled: false
  redis: {}
  repo: {}
  initialSSHKnownHosts: {}
  tls:
    ca: {}
