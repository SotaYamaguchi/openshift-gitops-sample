apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# RHDH を HA 構成 (replicas: 2) にする
# RHDH 1.5 以降で HA がサポートされている
# ref: https://access.redhat.com/documentation/en-us/red_hat_developer_hub/1.9/html-single/about_red_hat_developer_hub/index

patches:
  - target:
      group: rhdh.redhat.com
      version: v1alpha4
      kind: Backstage
      name: developer-hub
    patch: |-
      - op: replace
        path: /spec/application/replicas
        value: 2
