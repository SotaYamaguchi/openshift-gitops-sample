apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# RHDH を外部 Aurora PostgreSQL に接続する
# enableLocalDb を無効化し、ExternalSecret から DB 接続情報を取得する
# ref: https://access.redhat.com/documentation/en-us/red_hat_developer_hub/1.9/html-single/configuring/index

resources:
  - external-secret-db.yaml

patches:
  - target:
      group: rhdh.redhat.com
      version: v1alpha5
      kind: Backstage
      name: developer-hub
    patch: |-
      - op: replace
        path: /spec/database/enableLocalDb
        value: false
