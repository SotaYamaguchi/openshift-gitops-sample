apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhdh-db-credentials
  namespace: rhdh
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rhdh-db-credentials
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: openshift/rhdh/database
        property: host
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: openshift/rhdh/database
        property: port
    - secretKey: POSTGRES_USER
      remoteRef:
        key: openshift/rhdh/database
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: openshift/rhdh/database
        property: password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-db
  namespace: rhdh
data:
  app-config-db.yaml: |
    backend:
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          ssl:
            require: true
            # TODO: RDS CA 証明書を ConfigMap でマウントし ca フィールドに指定して rejectUnauthorized: true に戻すこと
            # ref: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.SSL.html
            rejectUnauthorized: false
