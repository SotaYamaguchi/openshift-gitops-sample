apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-apps
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: &repo https://github.com/tarosaiba/openshift-gitops-sample.git
        revision: &rev main
        directories:
          - path: 'apps/*/*/overlays/all'
          - path: 'apps/*/*/overlays/hub'
          - path: 'apps/*/*/overlays/idp-cluster'
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-{{ index .path.segments 2 }}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: *repo
        targetRevision: *rev
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # ServerSideApply: フィールド衝突を回避しつつ Operator 管理リソースと共存
        # SkipDryRunOnMissingResource: Operator CRD 未登録時の dry-run エラーを回避
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
